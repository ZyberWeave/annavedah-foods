<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B2335"/>
      <stop offset="100%" stop-color="#5A0F1A"/>
    </radialGradient>
    <!-- Subtle damask petal pattern -->
    <pattern id="damask" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <ellipse cx="32" cy="16" rx="6" ry="10" fill="#7A1828" opacity="0.4"/>
      <ellipse cx="32" cy="48" rx="6" ry="10" fill="#7A1828" opacity="0.4"/>
      <ellipse cx="16" cy="32" rx="10" ry="6" fill="#7A1828" opacity="0.4"/>
      <ellipse cx="48" cy="32" rx="10" ry="6" fill="#7A1828" opacity="0.4"/>
      <circle cx="32" cy="32" r="4" fill="#7A1828" opacity="0.3"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  <!-- Damask texture overlay -->
  <rect width="512" height="512" fill="url(#damask)" rx="80" opacity="0.6"/>

  <!-- Decorative border -->
  <rect x="18" y="18" width="476" height="476" fill="none" stroke="#C9A45C" stroke-width="3" rx="65" opacity="0.5"/>
  <rect x="26" y="26" width="460" height="460" fill="none" stroke="#C9A45C" stroke-width="1" rx="58" opacity="0.3"/>

  <!-- Gold "A" lettermark — stylized calligraphic -->
  <text
    x="256"
    y="360"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="340"
    font-weight="bold"
    text-anchor="middle"
    fill="#D4AF6B"
    filter="url(#glow)"
    letter-spacing="-10"
  >A</text>

  <!-- Bottom decorative line -->
  <line x1="150" y1="400" x2="362" y2="400" stroke="#C9A45C" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="420" r="4" fill="#C9A45C" opacity="0.7"/>
  <circle cx="236" cy="420" r="2" fill="#C9A45C" opacity="0.4"/>
  <circle cx="276" cy="420" r="2" fill="#C9A45C" opacity="0.4"/>
</svg>